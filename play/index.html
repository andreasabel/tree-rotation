<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tree Game Playground</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f7fb;
        --panel: #ffffff;
        --ink: #18202a;
        --muted: #566171;
        --line: #2f6feb;
        --ball: #1f2328;
        --danger: #d1242f;
        --shadow: 0 12px 30px rgba(24, 32, 42, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: linear-gradient(180deg, #eef3fb 0%, var(--bg) 100%);
        color: var(--ink);
      }

      .page {
        width: min(1100px, 96vw);
        height: 100vh;
        margin: 0 auto;
        display: grid;
        grid-template-rows: 1fr 8fr 1fr;
        justify-items: center;
        align-items: stretch;
        gap: 1rem;
        padding: 1rem 0;
      }

      .zone {
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .panel {
        width: min(100%, 980px);
        height: 100%;
        background: var(--panel);
        border-radius: 20px;
        box-shadow: var(--shadow);
      }

      .stats-panel {
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 0 1rem;
      }

      .stats-grid {
        display: grid;
        grid-template-columns: repeat(4, max-content 8ch);
        gap: 0.75rem 1rem;
        align-items: center;
        font-size: clamp(1rem, 1.8vw, 1.3rem);
        font-weight: 600;
      }

      .stat-label {
        color: var(--muted);
      }

      .stat-value {
        width: 8ch;
        text-align: right;
        font-variant-numeric: tabular-nums;
      }

      .stat-value.invalid {
        color: var(--danger);
      }

      .tree-panel {
        position: relative;
        padding: 1rem;
        overflow: hidden;
      }

      #treeSvg {
        width: 100%;
        height: 100%;
        display: block;
      }

      .tree-line {
        stroke: var(--line);
        stroke-width: 12;
        stroke-linecap: round;
      }

      .tree-node {
        fill: var(--ball);
      }

      .illegal-mark {
        position: absolute;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        font-size: min(45vh, 45vw);
        font-weight: 800;
        color: var(--danger);
        line-height: 1;
        user-select: none;
      }

      .tree-panel.illegal .illegal-mark {
        display: flex;
      }

      .tree-panel.illegal #treeSvg {
        visibility: hidden;
      }

      .input-panel {
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 0 1rem;
      }

      #moveInput {
        width: min(100%, 900px);
        height: 3.25rem;
        border: 2px solid #c5d1e0;
        border-radius: 14px;
        padding: 0 1rem;
        font-size: clamp(1rem, 2vw, 1.35rem);
        font-family: ui-monospace, SFMono-Regular, SFMono-Regular, Menlo, monospace;
        color: var(--ink);
        background: #fbfcff;
        outline: none;
      }

      #moveInput:focus {
        border-color: var(--line);
        box-shadow: 0 0 0 4px rgba(47, 111, 235, 0.16);
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="zone">
        <div class="panel stats-panel">
          <div class="stats-grid">
            <div class="stat-label">C</div>
            <div class="stat-value" id="cCount">0</div>
            <div class="stat-label">T</div>
            <div class="stat-value" id="tCount">0</div>
            <div class="stat-label">R</div>
            <div class="stat-value" id="rCount">0</div>
            <div class="stat-label">R/C</div>
            <div class="stat-value" id="ratioValue">n/a</div>
          </div>
        </div>
      </section>

      <section class="zone">
        <div class="panel tree-panel" id="treePanel">
          <svg id="treeSvg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet" aria-label="Tree visualization"></svg>
          <div class="illegal-mark">X</div>
        </div>
      </section>

      <section class="zone">
        <div class="panel input-panel">
          <input
            id="moveInput"
            type="text"
            inputmode="text"
            autocomplete="off"
            autocapitalize="off"
            autocorrect="off"
            spellcheck="false"
            placeholder="Enter moves, for example ccrtcr"
          >
        </div>
      </section>
    </main>

    <script>
      const moveInput = document.getElementById("moveInput");
      const treeSvg = document.getElementById("treeSvg");
      const treePanel = document.getElementById("treePanel");
      const statElements = {
        c: document.getElementById("cCount"),
        t: document.getElementById("tCount"),
        r: document.getElementById("rCount"),
        ratio: document.getElementById("ratioValue"),
      };

      const horizontalSpacing = 120;
      const verticalSpacing = 120;
      const topPadding = 70;
      const sideMargin = 48;
      const verticalMargin = 48;
      const nodeRadius = 18;

      function makeLeaf() {
        return { kind: "leaf" };
      }

      function makeNode(left, right) {
        return { kind: "node", left, right };
      }

      function updateFromInput() {
        const cursorIndex = moveInput.selectionStart ?? moveInput.value.length;
        const prefix = moveInput.value.slice(0, cursorIndex);
        const result = evaluatePrefix(prefix);

        if (!result.legal) {
          renderInvalidState();
          return;
        }

        renderStats(result.counts);
        renderTree(result.tree);
      }

      function evaluatePrefix(prefix) {
        let tree = makeLeaf();
        const counts = { c: 0, t: 0, r: 0 };

        for (const rawCharacter of prefix) {
          const character = rawCharacter.toLowerCase();

          if (character === "c") {
            tree = makeNode(tree, makeLeaf());
            counts.c += 1;
            continue;
          }

          if (character === "r") {
            if (tree.kind === "node" && tree.left.kind === "node") {
              tree = makeNode(
                tree.left.left,
                makeNode(tree.left.right, tree.right),
              );
              counts.r += 1;
              continue;
            }

            return { legal: false };
          }

          if (character === "t") {
            if (tree.kind === "node" && tree.left.kind === "leaf") {
              tree = tree.right;
              counts.t += 1;
              continue;
            }

            return { legal: false };
          }

          return { legal: false };
        }

        return { legal: true, tree, counts };
      }

      function renderInvalidState() {
        treePanel.classList.add("illegal");
        for (const statElement of Object.values(statElements)) {
          statElement.textContent = "X";
          statElement.classList.add("invalid");
        }
      }

      function renderStats(counts) {
        treePanel.classList.remove("illegal");

        const ratioText =
          counts.c === 0 ? "n/a" : (counts.r / counts.c).toFixed(2);

        statElements.c.textContent = String(counts.c);
        statElements.t.textContent = String(counts.t);
        statElements.r.textContent = String(counts.r);
        statElements.ratio.textContent = ratioText;

        for (const statElement of Object.values(statElements)) {
          statElement.classList.remove("invalid");
        }
      }

      function renderTree(tree) {
        treeSvg.replaceChildren();

        const layout = layoutTree(tree);
        if (layout.nodes.length === 0) {
          treeSvg.setAttribute("viewBox", "0 0 100 100");
          return;
        }

        const xs = layout.nodes.map((node) => node.x);
        const ys = layout.nodes.map((node) => node.y);
        const minX = Math.min(...xs) - nodeRadius - sideMargin;
        const maxX = Math.max(...xs) + nodeRadius + sideMargin;
        const minY = Math.min(...ys) - nodeRadius - verticalMargin;
        const maxY = Math.max(...ys) + nodeRadius + verticalMargin;

        treeSvg.setAttribute(
          "viewBox",
          `${minX} ${minY} ${maxX - minX} ${maxY - minY}`,
        );

        for (const node of layout.nodes) {
          for (const child of [node.leftChild, node.rightChild]) {
            if (!child) {
              continue;
            }

            const edge = document.createElementNS("http://www.w3.org/2000/svg", "line");
            edge.setAttribute("x1", node.x);
            edge.setAttribute("y1", node.y);
            edge.setAttribute("x2", child.x);
            edge.setAttribute("y2", child.y);
            edge.setAttribute("class", "tree-line");
            treeSvg.append(edge);
          }
        }

        for (const node of layout.nodes) {
          const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
          circle.setAttribute("cx", node.x);
          circle.setAttribute("cy", node.y);
          circle.setAttribute("r", nodeRadius);
          circle.setAttribute("class", "tree-node");
          treeSvg.append(circle);
        }
      }

      function layoutTree(tree) {
        let nextLeafIndex = 0;
        const nodes = [];

        function visit(currentTree, depth) {
          if (currentTree.kind === "leaf") {
            const leafIndex = nextLeafIndex;
            nextLeafIndex += 1;
            return {
              startLeaf: leafIndex,
              endLeaf: nextLeafIndex,
              node: null,
            };
          }

          const leftLayout = visit(currentTree.left, depth + 1);
          const rightLayout = visit(currentTree.right, depth + 1);
          const x =
            ((leftLayout.startLeaf + rightLayout.endLeaf) / 2) * horizontalSpacing;
          const y = topPadding + depth * verticalSpacing;
          const node = {
            x,
            y,
            leftChild: leftLayout.node,
            rightChild: rightLayout.node,
          };

          nodes.push(node);
          return {
            startLeaf: leftLayout.startLeaf,
            endLeaf: rightLayout.endLeaf,
            node,
          };
        }

        visit(tree, 0);
        return { nodes };
      }

      function syncToCursor() {
        if (document.activeElement === moveInput) {
          updateFromInput();
        }
      }

      moveInput.addEventListener("input", updateFromInput);
      moveInput.addEventListener("click", updateFromInput);
      moveInput.addEventListener("keyup", updateFromInput);
      moveInput.addEventListener("select", updateFromInput);
      document.addEventListener("selectionchange", syncToCursor);

      window.addEventListener("load", () => {
        moveInput.focus();
        moveInput.setSelectionRange(moveInput.value.length, moveInput.value.length);
        updateFromInput();
      });
    </script>
  </body>
</html>
